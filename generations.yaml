generations:
  - name: "First Generation"
    start_year: 2008
    end_year: 2015
    description: "The first-generation Renault Koleos represented Renault's initial entry into the compact SUV segment, developed in collaboration with Nissan and manufactured by Renault Samsung Motors in South Korea. Built on the Nissan C platform shared with the Nissan X-Trail, the Koleos featured a conventional SUV silhouette with Renault's corporate styling of the period. Measuring 4.52 meters in length, it offered five seats and cargo space up to 1,380 liters with rear seats folded. Engine options included a 2.0-liter gasoline engine (140 hp) and 2.0-liter dCi diesel (150-175 hp), available with six-speed manual or CVT transmissions and front-wheel or all-wheel drive. The all-wheel drive system featured 2WD, Auto, and Lock modes. A facelift in July 2011 brought revised front styling, interior enhancements, and equipment upgrades. Production ended in March 2015, with the model withdrawn from the UK in 2010 due to poor sales."

  - name: "Second Generation"
    start_year: 2016
    end_year: 2023
    description: "The second-generation Renault Koleos, introduced at the 2016 Beijing Motor Show, marked a significant step up in size and quality, growing to 4.67 meters in length on the Renault-Nissan CMF-CD platform shared with the Nissan X-Trail and Renault Kadjar. Designed by Alexis Martot under Laurens van den Acker, it adopted Renault's design language with C-shaped LED lighting. Engine options included a 2.0-liter dCi diesel (130-175 hp), 2.5-liter gasoline (170 hp), and 1.6 dCi diesel, paired with six-speed manual or X-Tronic CVT transmissions. The interior featured a 7-inch touchscreen standard and optional 8.7-inch R-Link 2 system, with available features including heated leather seats, Bose audio, and panoramic sunroof. Safety features expanded to include adaptive cruise control, blind-spot monitoring, emergency braking, and around-view camera. A 2019/2020 facelift brought styling updates and improved technology. Production continued in Korea until April 2023, while other markets ended earlier."

  - name: "Third Generation"
    start_year: 2024
    end_year: null
    description: "The third-generation Renault Koleos, marketed as the Renault Grand Koleos, was introduced on June 27, 2024 at the Busan International Mobility Show. Built on Geely's Compact Modular Architecture platform (same as Geely Xingyue L/Monjaro) through the Renault-Geely partnership in South Korea, it represents a significant size increase over its predecessor. The design features redesigned front and rear fascias, a borderless grille, and body panels unique to Renault. The interior shares the Geely platform's dashboard with a 12.3-inch digital instrument display, 12.3-inch infotainment screen, and another 12.3-inch passenger touchscreen, all powered by Qualcomm hardware and marketed as openR. Powertrains include a 2.0-liter turbocharged engine with 7-speed dual-clutch or 8-speed automatic transmission, and an E-Tech Hybrid system combining a 1.5-liter turbo engine with a 1.64 kWh battery. Production began July 2024 at Renault Korea's Busan plant, with plans to expand to Middle East, Mexico, Colombia, and other markets."